[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "vite preview --host 0.0.0.0 --port 8000"
  port = 8888
  targetPort = 8000
  autoLaunch = false

# Redirect all unmatched paths to the SPA entry point
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless"]
